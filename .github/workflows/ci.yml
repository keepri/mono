name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bun-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: foley:build
        run: bun run foley:build
      - name: db:generate
        run: bun run db:generate
      - name: build
        run: bun run build
      - name: check
        run: bun run check
      - name: lint
        run: bun run lint
